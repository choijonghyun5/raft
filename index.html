<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Raft Survival</title>
<meta name="apple-mobile-web-app-title" content="Raft Survival">
<meta name="application-name" content="Raft Survival">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1d2a">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<!-- v: icons + tabs -->
<link rel="stylesheet" href="style.css"></head><body>
<div id="rot">📱 화면을 가로로 돌려 주세요</div>
<div id="wrap">
<canvas id="c"></canvas>
<div id="hud" class="abs"></div>
<div id="inv" class="abs"></div>
<div id="toast" class="abs"></div>
<div id="joy" class="abs"><div id="knob" class="abs"></div></div>
<div id="bAct" class="btn abs">행동</div>
<div id="bCraft" class="btn abs">제작</div>
<div id="bRow" class="btn abs">노</div>
<div id="bRun" class="btn abs">달리기</div>
<div id="qs" class="abs"></div><div id="goal" class="abs"></div><div id="det" class="abs"></div><div id="lpm" class="abs"></div><div id="bSet" class="btn abs">설정</div><div id="pk" class="abs"></div><div id="fm" class="abs"></div><div id="bInfo" class="btn abs">기록</div>
<div id="panel" class="abs"><div id="box"><h2>제작</h2><div id="list"></div></div></div>
<div id="stp" class="abs"><div id="stb"><h2>설정</h2><div class="row"><div><b>버튼 위치</b><small>조이스틱과 버튼을 끌어서 원하는 곳에 놓는다</small></div><span><button id="stEdit">편집</button> <button id="stReset">초기화</button></span></div></div></div>
<div id="edbar" class="abs"><span>버튼을 끌어서 옮기세요</span><button id="edReset">초기화</button><button id="edDone">완료</button></div>
<div id="end" class="abs"><div><h2>구조 신호의 근원</h2><div>자동 송신기는 누군가 살아남기를 바라며 수년째 신호를 보내고 있었다.</div><div>이제 당신이 그 신호의 마지막 수신자다.</div><button id="endBtn">계속 항해하기</button></div></div>
<div id="over" class="abs"><div><h2>바다에 삼켜졌다</h2><div>허기와 갈증을 관리하지 못했습니다.</div><button id="again">다시 시작</button></div></div>
</div>
<script src="game.js"></script></body></html>
